title: IOM Report
author: IOM
version: 1.0.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    typst:
      # Page geometry lives in page.typ, but these keys are still read by the
      # partials via Pandoc substitution, so keep them in sync.
      papersize: a4
      fontsize: 11pt
      margin:
        inside: 2.54cm
        outside: 2cm
        top: 2cm
        bottom: 2.2cm

      # House Style Manual conventions that Quarto can enforce directly
      number-sections: false
      fig-cap-location: top
      tbl-cap-location: top
      link-citations: true
      lang: en
      csl: null

      template-partials:
        - typst-template.typ
        - typst-show.typ
        - page.typ
    docx:
      reference-doc: iom-reference.docx
      toc: true
      toc-depth: 3
      toc-title: "Contents"
      number-sections: false
      fig-align: center
      lang: en-GB
